<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="space"></canvas>
    <div class="container">
        <h1>Clicker Game</h1>

        <div class="resources-section">
            <div class="resource" id="copperResource">Copper: <span id="copperAmount">0</span></div>
            <div class="resource" id="ironResource">Iron: <span id="ironAmount">0</span></div>
            <div class="resource" id="silverResource">Silver: <span id="silverAmount">0</span></div>
        </div>
        
        <div class="asteroid-section">
            <div class="score" id="score">0</div>
            <div class="per-second">per second: <span id="perSecond">0</span></div>
            <div id="asteroidName">Baby Asteroid</div>
            <div id="asteroidHealth">Health: 10/10</div>
            <div class="no-highlight" id="clickButton">Attack</div>
        </div>

        <div class="dashboard">
            <div class="upgrades-section">
                <h2>Upgrades</h2>
                <div id="upgradesContainer"></div>
            </div>

            <div class="multipliers-section">
                <h2>Multipliers</h2>
                <div id="multipliersContainer"></div>
            </div>
        </div>

        <div class="spaceship"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/animation.js"></script>
    <script src="js/asteroids.js"></script>
    <script src="js/upgrades.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
